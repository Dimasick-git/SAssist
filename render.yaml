# Render.com Blueprint -- deploys the SAssist Labs server to a public HTTPS/WSS URL.
# How to deploy:
#   1. Push this repo to GitHub (done).
#   2. Go to https://render.com -> New -> Blueprint -> connect the SAssist repo.
#   3. Render reads this file and creates the service. Click Apply.
#   4. You get a URL like https://sassist-labs.onrender.com  ->  use wss://sassist-labs.onrender.com in the app.
#
# Free mode: no card is needed. Render can spin a free service down after idle
# time, and its local files reset after a restart or redeploy. This mode is for
# testing only; persistent profiles, media and message history need an external
# database/object store or a paid persistent disk.
services:
  - type: web
    name: sassist-labs
    runtime: docker
    repo: https://github.com/Dimasick-git/SAssist
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/sassist-data
      - key: AUTH_SECRET
        generateValue: true        # persisted by Render so tokens survive restarts
      # Set in the Render dashboard to enable premium @username claims:
      # - key: PREMIUM_CODE
      #   sync: false
      # Optional e-mail OTP delivery (otherwise dev code is returned):
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
